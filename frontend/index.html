<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/src/assets/travelnest-favicon.svg"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="TravelNest - Discover unique stays and luxury travel experiences."
    />

    <meta
      name="theme-color"
      content="#FF385C"
    />

    <title>TravelNest</title>

    <!-- ✅ Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>
      (() => {
        const theme = localStorage.getItem("theme");
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>

  <body
    class="
      bg-white
      dark:bg-slate-900
      text-gray-900
      dark:text-white
    "
  >
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
